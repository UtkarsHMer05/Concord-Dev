# Concord dev load balancer (P4-M027): round-robin WebSocket proxy to HOST
# gateway processes (launcher: scripts/gateway-cluster.sh). Dev-only; no TLS;
# sticky sessions NOT enabled (reconnect-to-any-gateway is required — M029).
worker_processes 1;
events { worker_connections 4096; }

http {
  upstream concord_gateways {
    server host.docker.internal:8791 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8792 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8793 max_fails=3 fail_timeout=10s;
  }

  server {
    listen 8890;

    location / {
      proxy_pass http://concord_gateways;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
