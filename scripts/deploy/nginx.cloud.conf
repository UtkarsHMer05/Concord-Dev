# Concord cloud LB (P7-M021): round-robin WebSocket proxy to the three
# gateway CONTAINERS on the compose network (not host processes — that's
# the dev config). No sticky sessions (reconnect-to-any-gateway is a
# Phase 4 requirement); TLS terminates at the ALB in front.
worker_processes 1;
events { worker_connections 4096; }

http {
  upstream concord_gateways {
    server gw1:8791 max_fails=3 fail_timeout=10s;
    server gw2:8792 max_fails=3 fail_timeout=10s;
    server gw3:8793 max_fails=3 fail_timeout=10s;
  }

  server {
    listen 8890;

    location / {
      proxy_pass http://concord_gateways;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
