[workspace]
resolver = "2"
members = ["sync-gateway"]

[workspace.package]
# Release identity: 1.0.1 (matches package.json and the CMake project
# VERSION — the wire protocol version is a SEPARATE constant, see
# sync-gateway/src/lib.rs WIRE_PROTOCOL_VERSION, and must not track this).
version = "1.0.1"
edition = "2021"
# Aligned with the root LICENSE (docs/PROVENANCE.md resolves the
# tutorial-derived material; rust/deny.toml polices third-party crates).
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "process", "fs"] }
axum = { version = "0.8", features = ["ws"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1"] }
deadpool-postgres = { version = "0.14.2", features = ["rt_tokio_1"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
pkcs1 = "0.7"
pkcs8 = "0.10"
async-nats = "0.50"
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager"] }
# Phase 6 observability (P6-M009): OpenTelemetry + OTLP exporter +
# tracing bridge. Compiled in, but runtime-optional — nothing is
# initialized unless GATEWAY_OTEL_ENABLED=true (zero behavior change
# when disabled). 0.32 line: rt-tokio on the SDK, tonic gRPC transport
# on the OTLP exporter (tokio 1.x compatible).
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace", "testing"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry-stdout = { version = "0.32", features = ["trace"] }
tracing-opentelemetry = "0.33"
