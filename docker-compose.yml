# Concord local development infrastructure.
# Development only — explicitly non-production credentials below.
# Production deployment is a Phase 7 concern.

services:
  db:
    image: postgres:18.6-alpine
    container_name: concord-db
    restart: unless-stopped
    environment:
      # Local development credentials only — never use outside this machine.
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: concord_local_dev
      POSTGRES_DB: concord
    ports:
      # Host 5433: the machine's native PostgreSQL occupies 5432; Concord's
      # Docker database must not collide with it.
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18+ images expect the mount at /var/lib/postgresql (PGDATA
      # lives in a versioned subdirectory below it).
      - concord_pgdata:/var/lib/postgresql
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concord -d concord"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  concord_pgdata:
