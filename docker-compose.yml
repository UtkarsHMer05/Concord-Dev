# Concord local development infrastructure.
# Development only — explicitly non-production credentials below.
# Production deployment is a Phase 7 concern.

services:
  db:
    image: postgres:18.6-alpine
    container_name: concord-db
    restart: unless-stopped
    environment:
      # Local development credentials only — never use outside this machine.
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: concord_local_dev
      POSTGRES_DB: concord
    ports:
      # Host 5433: the machine's native PostgreSQL occupies 5432; Concord's
      # Docker database must not collide with it.
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18+ images expect the mount at /var/lib/postgresql (PGDATA
      # lives in a versioned subdirectory below it).
      - concord_pgdata:/var/lib/postgresql
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concord -d concord"]
      interval: 5s
      timeout: 3s
      retries: 12

  # NATS with JetStream enabled (Phase 4 inter-gateway event transport).
  # -P 5422: override the COPY-statement change in newer images; -js enables
  # JetStream; -sd sets a named volume for durable stream storage (restart
  # recovery, M038). Dev only — no authn in local compose (documented).
  nats:
    image: nats:2.11.6-alpine
    container_name: concord-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - concord_nats:/data
    healthcheck:
      # JetStream health endpoint: /jsz returns 200 when JetStream is up.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Redis — ephemeral tier only (presence, rate-limit counters, gateway
  # hints; DEC-033). Dev server without persistence by design: a wipe must
  # never be a data event (M037 proves it).
  redis:
    image: redis:8.8.2-alpine
    container_name: concord-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  concord_pgdata:
  concord_nats:
