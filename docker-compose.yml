# Concord local development infrastructure.
# Development only — explicitly non-production credentials below.
# Production deployment is a Phase 7 concern.

services:
  db:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: concord-db
    restart: unless-stopped
    environment:
      # Local development credentials only — never use outside this machine.
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: concord_local_dev
      POSTGRES_DB: concord
    ports:
      # Host 5433: the machine's native PostgreSQL occupies 5432; Concord's
      # Docker database must not collide with it.
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18+ images expect the mount at /var/lib/postgresql (PGDATA
      # lives in a versioned subdirectory below it).
      - concord_pgdata:/var/lib/postgresql
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concord -d concord"]
      interval: 5s
      timeout: 3s
      retries: 12

  # NATS with JetStream enabled (Phase 4 inter-gateway event transport).
  # -js enables JetStream; -sd sets a named volume for durable stream
  # storage (restart recovery, M038). Dev only — no authn in local compose
  # (documented; loopback-bound).
  nats:
    image: nats:2.12-alpine@sha256:b270f5e2428354c0335612694d7dd2fb588148e567a5757fdff325ef9c9332e6
    container_name: concord-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - concord_nats:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Redis — ephemeral tier only (presence, rate-limit counters, gateway
  # hints; DEC-033). No persistence by design: a wipe must never be a data
  # event (M037 proves it).
  redis:
    image: redis:8.8.2-alpine@sha256:96cb544fa0af5aa898d160cffb7dae70c3df117190fc123831c64712cda425ff
    container_name: concord-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Prometheus — local metric collection for the gateway cluster (P6-M011).
  # Scrapes the HOST gateways' /metrics endpoints (host.docker.internal)
  # and itself every 5s. Dev only: loopback-bound, no auth (documented).
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    container_name: concord-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2d"
    volumes:
      - ./scripts/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Grafana — provisioned dashboards over the local Prometheus (P6-M012).
  # Dev-only anonymous ADMIN auth: acceptable strictly because the port
  # is loopback-bound and the stack never leaves this machine — NEVER
  # enable this in any shared deployment.
  grafana:
    image: grafana/grafana:12.3.0@sha256:70d9599b186ce287be0d2c5ba9a78acb2e86c1a68c9c41449454d0fc3eeb84e8
    container_name: concord-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - ./scripts/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./scripts/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  concord_pgdata:
  concord_nats:

# Phase 4 gateway topology: three gateway processes run on the HOST via
# scripts/gateway-cluster.sh (the release binary is built for the host OS;
# container images are Phase 7 work) behind an nginx load balancer container
# (ws://127.0.0.1:8890/api/v1/sync). Infra services above are compose-managed.
# Observability (P6): prometheus + grafana above; see docs/OBSERVABILITY.md.
