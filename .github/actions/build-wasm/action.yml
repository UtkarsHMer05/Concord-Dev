name: Build CRDT WASM
description: Build the generated module before any web or realtime suite imports it.
runs:
  using: composite
  steps:
    - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest snapshot
    - name: Install Emscripten and build WASM
      shell: bash
      run: |
        git init -q "$RUNNER_TEMP/emsdk"
        git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 https://github.com/emscripten-core/emsdk.git 5eb0bde7585670252e8ba05e9d361627bffd08b5
        git -C "$RUNNER_TEMP/emsdk" checkout --detach -q FETCH_HEAD
        "$RUNNER_TEMP/emsdk/emsdk" install 6.0.9
        "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.9
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        npm run wasm:build
        npm run worker:bundle
        npm run wasm:smoke
