# CodeQL static security analysis (hardening F4).
#
# Languages: javascript/typescript (web + tooling) and cpp (the CRDT
# core). Rust is NOT universally supported by CodeQL — the Rust lane is
# covered by clippy -D warnings (phase6-pr-ci), cargo-audit, and
# cargo-deny (deny.toml); do not pretend otherwise.
#
# The cpp query suite needs the build to compile with the CodeQL
# wrappers; CMake + Ninja from the ubuntu-latest image suffice (the
# core is dependency-free — verified P6-M025 SBOM).
#
# Pinned actions (F2) + least-privilege permissions (F1): security-events
# write is required ONLY for uploading results.

name: codeql

on:
  push:
    branches: [main, "phase/*", "codex/*"]
  pull_request:
    branches: [main, "phase/*"]
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: cpp
            build-mode: manual
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0 (commit behind the annotated tag)
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build (cpp only)
        if: matrix.language == 'cpp'
        run: |
          cmake -S cpp -B build/codeql -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCONCORD_BUILD_TESTS=OFF -DCONCORD_BUILD_BENCHMARKS=OFF
          cmake --build build/codeql
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0 (commit behind the annotated tag)
        with:
          category: "/language:${{ matrix.language }}"
