# Phase 4 distributed gate: fmt/clippy/unit, Postgres+NATS+Redis services,
# broker + redis + multi-gateway distributed suites, web typecheck/unit.
# The heavy chaos runs (docker restarts, kill -9 storms) stay local via
# scripts/verify-cluster.sh (documented in docs/TESTING.md).
name: phase4-distributed
on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

jobs:
  distributed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: concord
          POSTGRES_PASSWORD: concord_local_dev
          POSTGRES_DB: concord
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U concord -d concord"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:8.8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      GATEWAY_DATABASE_URL: postgres://concord:concord_local_dev@127.0.0.1:5433/concord_test
      GATEWAY_CLERK_ISSUER: https://ci-placeholder.clerk.accounts.dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable snapshot
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
      # JetStream-enabled NATS (compose-style services can't pass a custom
      # command, so it runs as a step container).
      - name: Start NATS JetStream
        run: |
          docker run -d --name nats-js -p 4222:4222 -p 8222:8222 nats:2.11.6-alpine -js -sd /data -m 8222
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz >/dev/null; then echo "nats healthy"; exit 0; fi
            sleep 2
          done
          echo "nats did not become healthy"; exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create test database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U concord -d concord -c "CREATE DATABASE concord_test"
      - name: Apply application migrations before gateway migrations
        run: node scripts/db/migrate.mjs "$GATEWAY_DATABASE_URL"
      - name: fmt + clippy + unit
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
        working-directory: rust
      - name: DB + WS integration (Phase 3 regressions)
        run: |
          cargo test --test db_integration -- --test-threads=1
          cargo test --test ws_integration -- --test-threads=1
        working-directory: rust
      - name: Broker + Redis distributed suites
        run: |
          cargo test --test broker_integration -- --test-threads=1
          cargo test --test redis_integration -- --test-threads=1
        working-directory: rust
      - name: Generate disposable E2E keys
        run: node scripts/ci/generate-e2e-keys.mjs
      - name: Multi-gateway E2E (cross-gateway, faults, drain)
        run: |
          cargo build --release
          cargo test --test multi_gateway -- --test-threads=1
        working-directory: rust

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/build-wasm
      - name: Typecheck + lint + unit (protocol parity + sync layer)
        run: |
          npm run typecheck
          npm run lint
          npx vitest run --project unit
