# P6-M043 — PR CI gate (balanced: practical for PRs, honest failures).
#
# Jobs:
#   web      npm ci → typecheck + lint + unit tests + production build
#   rust     fmt --check → clippy -D warnings → cargo test --lib →
#            db_integration + ws_integration serialized against a Postgres
#            service container (run_migrations is executed inside the
#            db_integration suite itself — no separate migrate step).
#   native   portable cmake Release configure+build + root CTest (core,
#            property smoke and worker protocol suites) in GCC and Clang
#            matrix lanes.
#   wasm     emscripten emsdk install + npm run wasm:build + wasm smoke
#            (reuses the phase2-core pattern: emsdk clone, no container).
#   security secret-scan (tree mode — history mode is the nightly tier),
#            source dependency audit + cargo audit/deny. The PR job records
#            that image scanning is intentionally not run here; the release
#            workflow owns the mandatory Trivy image gate. No scan step uses
#            continue-on-error or converts a scanner failure into success.
#
# Protocol parity (golden vectors TS⇄Rust): covered by web unit tests
# (tests/protocol + fixtures/) and rust cargo test --lib (protocol golden
# tests) — both run in the web and rust jobs above; no separate job needed.
#
#   browser  real Playwright Chromium journey + accessibility, with Firefox
#            and WebKit auth/editor smoke coverage against the real Clerk
#            dev instance, gateway, PostgreSQL, NATS, Redis and WASM worker.
#
# SHARED-DB HAZARD (from SA-CHAOS6/SA-WEB6): all Rust integration suites
# and the TS db/realtime projects share ONE concord_test database. This
# workflow never runs the TS db/realtime projects, so the only in-workflow
# exposure is rust db_integration/ws_integration — serialized with
# --test-threads=1 per the house convention (phase3-gateway.yml). No other
# job in this workflow touches the DB, so jobs may run in parallel.
# Cross-workflow overlap is impossible: every job owns its runner + a
# dedicated service container (per-runner Postgres, port 5433).
#
# Concurrency: per-branch group cancels in-flight pushes (PR stack churn).
name: phase6-pr-ci

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

concurrency:
  group: phase6-pr-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/build-wasm
      - name: Typecheck + lint + unit tests (incl. TS protocol golden parity)
        run: |
          npm run typecheck
          npm run lint
          npx vitest run --project unit
      - name: Production build (dummy Clerk env — build-time only, never real secrets)
        # The Next build needs a publishable key shape to compile the Clerk
        # provider (same convention as docker/web.Dockerfile's dummy vars).
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: concord
          POSTGRES_PASSWORD: concord_local_dev
          POSTGRES_DB: concord
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U concord -d concord"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      GATEWAY_DATABASE_URL: postgres://concord:concord_local_dev@127.0.0.1:5433/concord_test
      GATEWAY_CLERK_ISSUER: https://ci-placeholder.clerk.accounts.dev
      DATABASE_TEST_URL: postgres://concord:concord_local_dev@127.0.0.1:5433/concord_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable snapshot
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create the test database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U concord -d concord -c "CREATE DATABASE concord_test"
      # TWO independent migration systems (documented in
      # rust/.../db/migrations.rs): drizzle owns the Phase 1 app tables
      # (users/documents/organizations/ACLs); the Rust gateway owns
      # crdt_* tables via its embedded runner. The Rust integration
      # suites seed users/documents directly via SQL, so the drizzle
      # family must exist first — apply it explicitly (the local flow is
      # identical: npm run db:migrate:test).
      - name: Apply drizzle migrations (Phase 1 tables) to concord_test
        run: node scripts/db/migrate.mjs "$DATABASE_TEST_URL"
      - name: fmt
        run: cargo fmt --all --check
        working-directory: rust
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
      - name: Unit tests (incl. Rust protocol golden parity)
        run: cargo test --lib
        working-directory: rust
      - name: DB integration tests (migrations run inside the suite) + WS integration
        run: |
          cargo test --test db_integration -- --test-threads=1
          cargo test --test ws_integration -- --test-threads=1
        working-directory: rust

  native:
    name: native (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest snapshot
      # Portable C++20 (cmake>=3.24 + Ninja via get-cmake); these are
      # exactly the steps phase2-core.yml / phase5-recovery.yml run —
      # reusing them keeps CI portable and consistent with house style.
      - name: Configure + build (Release) + native CTest
        run: |
          cmake -S cpp -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCONCORD_WARNINGS_AS_ERRORS=ON
          cmake --build build/native
          ctest --test-dir build/native --output-on-failure --parallel 1

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Emscripten via emsdk directly on the runner — same pattern as
      # phase2-core.yml (proven; no container needed).
      - uses: ./.github/actions/build-wasm
      - name: CRDT parity/runtime tests against the built module
        run: npx vitest run tests/crdt

  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            command: npm run test:browser
          - browser: firefox
            command: npm run test:browser:smoke:firefox
          - browser: webkit
            command: npm run test:browser:smoke:webkit
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: concord
          POSTGRES_PASSWORD: concord_local_dev
          POSTGRES_DB: concord
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U concord -d concord"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      nats:
        image: nats:2.11.6-alpine@sha256:7dec3f8f1ff181975dbdfc0d903d2a9724659648294dbc2ebb2fa3a294d573a6
        ports: ["4222:4222"]
      redis:
        image: redis:8.8.2-alpine@sha256:96cb544fa0af5aa898d160cffb7dae70c3df117190fc123831c64712cda425ff
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_TEST_URL: postgres://concord:concord_local_dev@127.0.0.1:5433/concord_test
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CONCORD_E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CONCORD_E2E_CLERK_SECRET_KEY }}
      GATEWAY_CLERK_ISSUER: ${{ secrets.CONCORD_E2E_CLERK_ISSUER }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable snapshot
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest snapshot
      - run: npm ci
      - name: Require the disposable Clerk E2E instance configuration
        run: |
          test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" || { echo "CONCORD_E2E_CLERK_PUBLISHABLE_KEY repository secret is required" >&2; exit 1; }
          test -n "$CLERK_SECRET_KEY" || { echo "CONCORD_E2E_CLERK_SECRET_KEY repository secret is required" >&2; exit 1; }
      - uses: ./.github/actions/build-wasm
      - name: Build release gateway
        run: cargo build --release
        working-directory: rust
      - name: Build release native worker
        run: |
          cmake -S cpp -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCONCORD_WARNINGS_AS_ERRORS=ON
          cmake --build build/native --target concord-worker
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run real browser gate
        run: ${{ matrix.command }}

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # secret-scan reads the tree via git ls-files; history needs full refs (tree mode used here)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable snapshot
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
      # Tree mode (not --history): PR-speed. Full-history scan is a nightly
      # concern; the tree covers everything a PR can introduce.
      - name: Secret scan (working tree)
        run: bash scripts/security/secret-scan.sh
      - name: Secret scanner fail-closed regression
        run: bash scripts/security/secret-scan-tests.sh
      # npm audit — app+dev tree; gate at high. (dep-scan below does the
      # classified aggregate; this is the fast first line.)
      - name: npm audit (high threshold)
        run: npm audit --audit-level=high
      # cargo audit (RustSec over Cargo.lock) — installed if absent; a
      # missing binary must NOT silently pass.
      - name: cargo audit (install if missing)
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo-audit" ]; then
            echo "cargo-audit not found — installing (cargo install cargo-audit --locked)"
            cargo install cargo-audit --locked
          fi
          (cd rust && cargo audit)
      # Source dependency aggregate. Container scanning is deliberately
      # explicit here: release-artifacts runs Trivy + scan-gate against the
      # exact images it builds. A skipped PR image scan must not be mistaken
      # for a green image result.
      - name: Dependency scan (source trees; container scan is release-only)
        run: bash scripts/security/dep-scan.sh --skip-containers
      # Provenance gate (hardening G2/G6): no shipped file may be
      # byte-identical to the antonio-original-baseline tutorial tree
      # unless allowlisted with a verified permissive upstream license
      # (the shadcn/ui primitives). Also bans known baseline assets.
      # Fail-closed contract (SA-PROV1 fix): a missing/invalid baseline
      # tag, a zero-file baseline, or an internal git failure exits 2 and
      # fails this job — the gate can no longer pass by scanning nothing.
      - name: Provenance check (baseline identity gate)
        run: bash scripts/security/provenance-check.sh
      # Provenance regression tests (SA-PROV1): pin the fail-closed
      # contract from every side — missing/invalid tag, zero-file
      # baseline, unallowlisted identical file, allowlist branch, nonzero
      # checked-path count, and internal git failure — so the false-green
      # cannot regress.
      - name: Provenance regression tests
        run: bash scripts/security/provenance-tests.sh
      # Findings-ledger validation: duplicate IDs, status vocabulary,
      # severity format, required columns, and no OPEN repository-
      # actionable Critical/High — the audit ledger stays internally
      # consistent or the PR fails.
      - name: Findings ledger validation
        run: bash scripts/security/validate-findings.sh
      # cargo-deny (hardening F6): advisories + license policy + source
      # restrictions over the Cargo tree. Installed if absent — a missing
      # binary must NOT silently pass.
      - name: cargo deny (install if missing)
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo-deny" ]; then
            echo "cargo-deny not found — installing (cargo install cargo-deny --locked)"
            cargo install cargo-deny --locked
          fi
          (cd rust && cargo deny --workspace check)
