# P6-M047 — Release artifact workflow (build, smoke, checksum, SBOM, scan).
#
# ================== NO DEPLOYMENT — EXPLICIT ==================
# This workflow builds and verifies artifacts. It NEVER pushes images to
# a registry, NEVER logs into a cloud provider, NEVER touches a deploy
# target, and uploads ONLY to the workflow run's artifacts. Production
# deployment is Phase 7 work (per docs/OPERATIONS.md and the Dockerfiles'
# "LOCAL BUILD + SMOKE ONLY" banners). Setting DEPLOY=false below would
# be decoration; the honest statement is: no deploy steps exist here.
# ================================================================
#
# Triggers: workflow_dispatch (manual release build) + canonical v1-style
# tag pushes (both the historical `concord-v*` convention and `v*`).
#
# Artifacts produced (into release-artifacts/, uploaded once):
#   concord-web-image.tar          hardened web image (docker/web.Dockerfile)
#   concord-gateway-image.tar       hardened gateway image (docker/gateway.Dockerfile)
#   concord-worker-linux-amd64.tgz  native worker, Release build, portable C++20
#   concord-wasm.tgz                WASM CRDT core (npm run wasm:build output)
#   SHA256SUMS                      sha256 of every artifact
#   sbom/                           CycloneDX SBOMs via scripts/security/sbom.sh
#
# Verification (fail honestly):
#   - images: scripts/release/smoke-images.sh (builds from git archive
#     HEAD — clean tree, not the dirty working tree — then boots each
#     container and asserts health + non-root uid). Reused as-is: it
#     already builds BOTH images from the archive and smoke-starts them.
#     The image .tar artifacts are exported from the exact images the
#     script built (same tags, tagged release-stable before export).
#   - worker artifact: the worker's --version argv mode (release 1.0.0)
#     reports the CMake project VERSION + short git sha and exits 0 before
#     any stdin reading (wired via CONCORD_VERSION/CONCORD_GIT_SHA compile
#     definitions). As a deeper probe, one generate_ops stdin request
#     (command 6: [u32 6][u64 seed][u32 op_count][u32 replicas][u32
#     shape] under the [u32 len] prefix) asserts a status=0 response
#     frame carrying a digest and ≥1 batch. This is the same command the
#     Rust differential verifier uses; a worker that cannot execute it
#     is not shippable.
#   - wasm artifact: node wasm/smoke.mjs (the repo's own WASM gate).
#   - SBOMs: scripts/security/sbom.sh (deterministic CycloneDX; validate
#     step included). SBOMs are committed at scripts/sbom/ by that script
#     — the artifact copies carry the release-tag context.
#   - Image vulnerability scan: trivy (aquasecurity/trivy-action) with
#     the verdict ENFORCED by scripts/security/scan-gate.sh: a NEW
#     critical/high finding fails the release unless it carries an
#     explicit allowlist entry (reason, owner, future review date).
#     Blanket pass-on-scan-failure is prohibited (hardening F8); the
#     scan JSONs are kept as release evidence either way.

name: phase6-release-artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*", "concord-v*"]

concurrency:
  group: phase6-release-artifacts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # smoke-images.sh builds from `git archive HEAD` — full history
          # not required, but a clean HEAD is; checkout of the tag commit
          # is exactly what should be released.
          fetch-depth: 1
      - name: Pin reproducible release timestamp to the checked-out commit
        run: |
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          test -n "$source_date_epoch"
          test "$source_date_epoch" -ge 0
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable snapshot
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest snapshot

      # ---------------- Native worker artifact (Release tar) ----------------
      - name: Build native worker (Release)
        run: |
          cmake -S cpp -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native
      # Version probe (--version prints "concord-worker <version> (<sha>)"
      # and exits 0 before any stdin reading) + a deeper stdin command
      # probe: one generate_ops request → assert status 0 + digest + ≥1
      # batch. Proven against the worker protocol (cpp/worker/main.cpp
      # command ids + response shape).
      - name: Smoke the worker binary (--version + generate_ops stdin probe)
        run: |
          ./build/native/worker/concord-worker --version
          python3 - <<'EOF'
          import struct, subprocess, sys
          # --version must exit 0 with a one-line version report (no stdin).
          p = subprocess.run(["build/native/worker/concord-worker", "--version"],
                             capture_output=True, input=b"")
          assert p.returncode == 0, f"--version exit {p.returncode}"
          line = p.stdout.decode().strip()
          assert line.startswith("concord-worker "), f"bad version line: {line!r}"
          print(f"worker --version OK: {line}")
          payload = struct.pack("<I", 6) + struct.pack("<Q", 1) + struct.pack("<III", 10, 2, 0)
          frame = struct.pack("<I", len(payload)) + payload
          p = subprocess.run(["build/native/worker/concord-worker"], input=frame, capture_output=True)
          out = p.stdout
          if p.returncode != 0 or len(out) < 12:
              sys.exit("worker probe: bad exit/short response")
          status, digest_len = struct.unpack("<II", out[:8])
          batch_count = struct.unpack("<I", out[8 + digest_len:12 + digest_len])[0]
          assert status == 0, f"worker returned status {status}"
          assert digest_len > 0, "empty digest"
          assert batch_count >= 1, "no batches in generate response"
          print(f"worker probe OK: status=0 digest_len={digest_len} batches={batch_count}")
          EOF
      - name: Package worker artifact (tar)
        run: |
          mkdir -p release-artifacts
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            -czf release-artifacts/concord-worker-linux-amd64.tgz \
            -C build/native/worker concord-worker

      # ---------------- WASM artifact ----------------
      - name: Build WASM (emscripten) + smoke + package
        run: |
          EMSDK_VERSION=6.0.9
          git init -q /tmp/emsdk
          git -C /tmp/emsdk fetch --depth 1 https://github.com/emscripten-core/emsdk.git 5eb0bde7585670252e8ba05e9d361627bffd08b5
          git -C /tmp/emsdk checkout --detach -q FETCH_HEAD
          /tmp/emsdk/emsdk install "$EMSDK_VERSION"
          /tmp/emsdk/emsdk activate "$EMSDK_VERSION"
          source /tmp/emsdk/emsdk_env.sh
          npm ci
          npm run wasm:build
          tracked_worker_sha="$(sha256sum public/crdt-worker.js | awk '{print $1}')"
          npm run worker:bundle
          generated_worker_sha="$(sha256sum public/crdt-worker.js | awk '{print $1}')"
          test "$tracked_worker_sha" = "$generated_worker_sha" || {
            echo "release: tracked public/crdt-worker.js is not reproducible from this source tree" >&2
            exit 1
          }
          node wasm/smoke.mjs
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            -czf release-artifacts/concord-wasm.tgz -C public wasm

      # The generated WASM is intentionally git-ignored. Assemble a clean
      # git-archive tree plus the just-built artifacts for the image build;
      # this keeps the source tree clean while proving the image contains
      # the exact WASM/worker output produced from the checked-out commit.
      - name: Prepare clean image source tree with verified generated assets
        run: |
          image_source="$RUNNER_TEMP/concord-image-source-${GITHUB_RUN_ID}"
          mkdir -p "$image_source"
          git archive HEAD | tar -x -C "$image_source"
          test ! -e "$image_source/.git"
          test -f public/wasm/concord-crdt.js
          test -f public/wasm/concord-crdt.wasm
          test -f public/crdt-worker.js
          mkdir -p "$image_source/public/wasm"
          cp public/wasm/concord-crdt.js public/wasm/concord-crdt.wasm "$image_source/public/wasm/"
          test -f "$image_source/public/wasm/concord-crdt.js"
          test -f "$image_source/public/wasm/concord-crdt.wasm"
          echo "CONCORD_SMOKE_TREE=$image_source" >> "$GITHUB_ENV"

      # The gateway intentionally fail-fast exits without Postgres. Provide a
      # disposable, digest-pinned database on the runner so the image smoke
      # proves the real startup/migration/health path on Linux as well as on
      # macOS Docker Desktop. The smoke helper adds the host-gateway mapping.
      - name: Start disposable PostgreSQL for image smoke
        run: |
          # Bind on the disposable runner bridge, not only Linux loopback:
          # the gateway smoke container reaches this service through
          # host.docker.internal (mapped to host-gateway below).
          docker run -d --name concord-release-smoke-db \
            --health-cmd='pg_isready -U concord -d concord_test' \
            --health-interval=1s --health-timeout=5s --health-retries=30 \
            -e POSTGRES_USER=concord \
            -e POSTGRES_PASSWORD=concord_local_dev \
            -e POSTGRES_DB=concord_test \
            -p 5433:5432 \
            postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          for attempt in $(seq 1 60); do
            health="$(docker inspect --format '{{.State.Health.Status}}' concord-release-smoke-db)"
            if [ "$health" = healthy ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs concord-release-smoke-db
          exit 1

      # ---------------- Hardened release images + smoke ----------------
      # smoke-images.sh: builds BOTH images from `git archive HEAD` (clean
      # committed tree — in-flight working-tree edits cannot leak into the
      # artifacts), boots the gateway (health/live + uid 10001) and web
      # (HTTP up + uid 1000), then reports PASS/FAIL per image.
      - name: Build + smoke release images (clean git-archive tree)
        run: scripts/release/smoke-images.sh
        env:
          CONCORD_SMOKE_DATABASE_URL: postgres://concord:concord_local_dev@host.docker.internal:5433/concord_test
          CONCORD_SMOKE_HOST_GATEWAY: "1"
      - name: Stop disposable PostgreSQL smoke service
        if: always()
        run: docker rm -f concord-release-smoke-db >/dev/null 2>&1 || true
      # Export the exact images the smoke verified under fixed local tags.
      # The release ref is metadata, not a shell argument; keeping it out of
      # docker tag/save also prevents a hostile tag name from becoming a
      # command fragment.
      - name: Export image artifacts
        run: |
          docker tag concord-gateway:smoke concord-gateway:release
          docker tag concord-web:smoke concord-web:release
          docker save concord-gateway:release \
            -o release-artifacts/concord-gateway-image.tar
          docker save concord-web:release \
            -o release-artifacts/concord-web-image.tar

      # ---------------- SBOMs ----------------
      # Deterministic CycloneDX for web (npm), rust-gateway (Cargo.lock),
      # native-worker + wasm (hand-authored manifest; no third-party C/C++
      # deps — verified P6-M025). Script writes scripts/sbom/ + validates
      # (JSON parse + secret-scan over the outputs).
      - name: Generate + validate SBOMs
        run: |
          bash scripts/security/sbom.sh
          mkdir -p release-artifacts/sbom
          cp scripts/sbom/*.cdx.json release-artifacts/sbom/

      # ---------------- Image vulnerability scan ----------------
      # trivy over the two built images. The verdict is enforced by
      # scripts/security/scan-gate.sh: a NEW critical/high finding fails
      # the release unless it carries an explicit allowlist entry with
      # reason, owner, and a future review date. Blanket pass-on-scan-
      # failure is prohibited (F8); the scan JSONs are kept as evidence
      # either way.
      - name: Vulnerability scan of web image (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 commit (pins setup-trivy v0.2.6)
        with:
          image-ref: concord-web:release
          format: json
          output: release-artifacts/trivy-web.json
          exit-code: "0"
          severity: CRITICAL,HIGH
      - name: Vulnerability scan of gateway image (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 commit (pins setup-trivy v0.2.6)
        with:
          image-ref: concord-gateway:release
          format: json
          output: release-artifacts/trivy-gateway.json
          exit-code: "0"
          severity: CRITICAL,HIGH
      - name: Enforce scan verdict (allowlist-gated; new critical/high fails)
        run: scripts/security/scan-gate.sh release-artifacts/trivy-web.json release-artifacts/trivy-gateway.json

      # ---------------- Traceability manifest ----------------
      # The manifest is written before SHA256SUMS so the sums file can cover
      # it without a circular self-hash. It carries the exact checked-out
      # commit/tag, protocol version, artifact/SBOM hashes and toolchain
      # versions. Docker image IDs are recorded when available.
      - name: Write release traceability manifest
        run: |
          node scripts/release/write-manifest.mjs \
            --dir release-artifacts \
            --commit "$(git rev-parse HEAD)" \
            --tag "${GITHUB_REF_NAME:-manual}" \
            --image-ref "concord-gateway:${GITHUB_REF_NAME:-manual}" \
            --image-ref "concord-web:${GITHUB_REF_NAME:-manual}"

      # ---------------- Checksums ----------------
      - name: SHA256SUMS over every artifact
        run: |
          cd release-artifacts || exit 1
          # Checksum every produced file except the sums file itself.
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      # ---------------- Upload ----------------
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: concord-release-${{ github.run_id }}
          path: release-artifacts/
          retention-days: 90
          if-no-files-found: error

      # NO DEPLOYMENT STEPS FOLLOW. Nothing below this line may push,
      # publish, or deploy — that is Phase 7 work (docs/OPERATIONS.md).
