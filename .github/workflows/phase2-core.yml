# Phase 2 core gate: native CRDT build/tests + WASM build/parity + web build.
# Heavy fuzz/sanitizer matrices stay local (documented in docs/TESTING.md).
name: phase2-core
on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest snapshot
      - name: Configure + build + test (native)
        run: |
          cmake -S cpp -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native
          ./build/native/crdt/tests/concord_crdt_tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/build-wasm
      - name: Typecheck + lint + unit tests
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA
