# Phase 2 core gate: native CRDT build/tests + WASM build/parity + web build.
# Heavy fuzz/sanitizer matrices stay local (documented in docs/TESTING.md).
name: phase2-core
on:
  push:
    branches: [main, "phase/**"]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure + build + test (native)
        run: |
          cmake -S cpp -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native
          ./build/native/crdt/tests/concord_crdt_tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck + lint + unit tests
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: WASM build (emscripten)
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install latest
          /tmp/emsdk/emsdk activate latest
          source /tmp/emsdk/emsdk_env.sh
          npm run wasm:build
          node wasm/smoke.mjs
      - name: Production build
        run: npm run build
